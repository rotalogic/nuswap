services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nuswap
      POSTGRES_PASSWORD: nuswap
      POSTGRES_DB: nuswap
    ports:
      # Hanya dari mesin ini, karena password database di atas bersifat umum.
      - "127.0.0.1:5432:5432"
    volumes:
      - nuswap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuswap -d nuswap"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://nuswap.rotalogic.id}
    environment:
      DATABASE_URL: postgres://nuswap:nuswap@db:5432/nuswap
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?isi ADMIN_PASSWORD di file .env}
      SESSION_SECRET: ${SESSION_SECRET:?isi SESSION_SECRET di file .env}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run start"

volumes:
  nuswap_pgdata:
